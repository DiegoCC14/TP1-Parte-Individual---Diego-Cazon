spring.application.name=Ferreteria

# ==============================================================
# CONFIGURACIÓN DE BASE DE DATOS SQLITE3 (POR DEFECTO)
# Base de datos embebida sin necesidad de servidor externo
# ==============================================================
spring.datasource.url=jdbc:sqlite:ferreteria.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# CONFIGURACIÓN ALTERNATIVA: MYSQL
# Para cambiar a MySQL, descomentar las líneas inferiores
# y comentar la sección de SQLite de arriba
# ==============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/ferreteria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==============================================================
# CONFIGURACIÓN THYMELEAF
# ==============================================================
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# Puerto del servidor
server.port=8080
