<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD HTML, CSS y JavaScript</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="contenedor">
        <h1 class="titulo">CRUD Local (usando array)</h1>

        <div class="contenedor-principal">
            <!-- Formulario -->
            <div class="contenedor-formulario">
                <h2>Agregar Empleado</h2>
                <form id="formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ingresa tu nombre">

                    <label for="puesto">Puesto:</label>
                    <input type="text" id="puesto" placeholder="Ingresa tu puesto">

                    <button type="submit" id="btnAgregar">Agregar</button>
                </form>
            </div>

            <!-- Listado de Elementos -->
            <div class="contenedor-listado">
                <h2>Listado de Empleados</h2>
                <div class="div-empleados">
                    <!-- Aquí se irán agregando los elementos con JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
